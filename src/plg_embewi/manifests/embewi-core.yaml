apiVersion: v1
kind: Namespace
metadata:
  name: embewi
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: embewi-core
  namespace: embewi
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: embewi-core
rules:
  - apiGroups: [embewi.io]
    resources: [mcunodes, mcudeployments]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [embewi.io]
    resources: [mcunodes/status, mcudeployments/status]
    verbs: [get, update, patch]
  - apiGroups: [""]
    resources: [services]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: embewi-core
subjects:
  - kind: ServiceAccount
    name: embewi-core
    namespace: embewi
roleRef:
  kind: ClusterRole
  name: embewi-core
  apiGroup: rbac.authorization.k8s.io
---
# Secret template — à remplir avant le déploiement.
# Clé = EMBEWI_NODE_ID du firmware, valeur = token hex partagé.
apiVersion: v1
kind: Secret
metadata:
  name: embewi-tokens
  namespace: embewi
type: Opaque
data: {}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: embewi-core
  namespace: embewi
  labels:
    app: embewi-core
spec:
  replicas: 1
  selector:
    matchLabels:
      app: embewi-core
  template:
    metadata:
      labels:
        app: embewi-core
    spec:
      serviceAccountName: embewi-core
      # hostNetwork expose directement port 8080 sur 192.168.22.1 pour les ESP32
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      nodeSelector:
        node-role.kubernetes.io/control-plane: ""
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      containers:
        - name: embewi-core
          image: ghcr.io/iobewi/embewi-core:latest
          args:
            - --heartbeat-address=:8080
            - --metrics-bind-address=:8082
            - --health-probe-bind-address=:8083
            - --token-secret=embewi-tokens
          ports:
            - name: heartbeat
              containerPort: 8080
              protocol: TCP
            - name: metrics
              containerPort: 8082
              protocol: TCP
            - name: health
              containerPort: 8083
              protocol: TCP
          env:
            - name: OCI_INSECURE_TLS
              value: "true"
            - name: OCI_REGISTRY_USER
              valueFrom:
                secretKeyRef:
                  name: embewi-registry
                  key: username
                  optional: true
            - name: OCI_REGISTRY_PASS
              valueFrom:
                secretKeyRef:
                  name: embewi-registry
                  key: password
                  optional: true
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8083
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8083
            initialDelaySeconds: 5
            periodSeconds: 10
