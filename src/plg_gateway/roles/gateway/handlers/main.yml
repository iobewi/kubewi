- name: restart systemd-networkd
  ansible.builtin.systemd:
    name: systemd-networkd
    state: restarted
  async: 1
  poll: 0
  ignore_errors: true

- name: reload and start kubewi-nat
  ansible.builtin.systemd:
    name: kubewi-nat
    state: restarted
    daemon_reload: true

- name: restart systemd-resolved
  ansible.builtin.systemd:
    name: systemd-resolved
    state: restarted
