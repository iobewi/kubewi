- name: restart hostapd
  ansible.builtin.systemd:
    name: hostapd
    state: restarted

- name: restart systemd-networkd
  ansible.builtin.systemd:
    name: systemd-networkd
    state: restarted
  async: 1
  poll: 0
  ignore_errors: true

- name: reload and start kubewi-wifi-forward
  ansible.builtin.systemd:
    name: kubewi-wifi-forward
    state: restarted
    daemon_reload: true
