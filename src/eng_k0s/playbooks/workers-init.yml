- name: Bootstrap workers (SSH key + sudo)
  hosts: workers
  gather_facts: false
  vars:
    ansible_host: "{{ init_host }}"
  tasks:
    - name: Deploy authorized key
      ansible.posix.authorized_key:
        user: "{{ ansible_user }}"
        key: "{{ lookup('file', '~/.ssh/kubewi_ansible.pub') }}"
        state: present

    - name: Configure passwordless sudo
      ansible.builtin.copy:
        content: "{{ ansible_user }} ALL=(ALL) NOPASSWD: ALL\n"
        dest: "/etc/sudoers.d/{{ ansible_user }}-nopasswd"
        mode: "0440"
        validate: /usr/sbin/visudo -cf %s

- name: System provisioning
  hosts: workers
  vars:
    ansible_host: "{{ init_host }}"
  roles:
    - role: rpios
      when: eng_rpios is defined
    - role: ubuntu
      when: eng_rpios is not defined and ansible_distribution == 'Ubuntu'
    - role: debian
      when: eng_rpios is not defined and ansible_distribution == 'Debian'

- name: Network provisioning
  hosts: workers
  vars:
    ansible_host: "{{ init_host }}"
    host_id: "{{ hostvars[inventory_hostname]['ansible_host'].split('.')[-1] }}"
  roles:
    - network
    - internal

# Après cette étape, eth0 devient membre de br0 (plus de DHCP provisioning)
# Le worker est maintenant joignable via ansible_host (VLAN 220)
- name: Attendre la disponibilité sur VLAN 220
  hosts: workers
  gather_facts: false
  tasks:
    - name: Wait for worker on VLAN 220
      ansible.builtin.wait_for:
        host: "{{ ansible_host }}"
        port: 22
        timeout: 60
      delegate_to: localhost
