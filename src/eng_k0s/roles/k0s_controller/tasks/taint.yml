- name: Remove control-plane NoSchedule taint
  ansible.builtin.command:
    cmd: k0s kubectl taint nodes {{ inventory_hostname }} node-role.kubernetes.io/control-plane:NoSchedule-
  register: taint_result
  changed_when: "'untainted' in taint_result.stdout"
  failed_when:
    - taint_result.rc != 0
    - "'not found' not in taint_result.stderr"
