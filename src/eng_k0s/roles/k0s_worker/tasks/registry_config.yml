- name: Create k0s containerd drop-in directory
  ansible.builtin.file:
    path: "{{ k0s_config_dir }}/containerd.d"
    state: directory
    mode: "0755"

- name: Configure containerd insecure registry
  ansible.builtin.template:
    src: containerd-registry.toml.j2
    dest: "{{ k0s_config_dir }}/containerd.d/registry.toml"
    mode: "0644"
