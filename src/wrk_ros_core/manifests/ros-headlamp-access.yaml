# Socle RBAC Headlamp ROS — déployé via kubewi ros deploy
---
apiVersion: v1
kind: Namespace
metadata:
  name: ros
  labels:
    app.kubernetes.io/managed-by: kubewi
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: headlamp-ros
  namespace: ros
  labels:
    app.kubernetes.io/managed-by: kubewi
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: headlamp-ros
  namespace: ros
  labels:
    app.kubernetes.io/managed-by: kubewi
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "services", "endpoints", "events", "configmaps", "persistentvolumeclaims"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets", "replicasets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: headlamp-ros
  namespace: ros
  labels:
    app.kubernetes.io/managed-by: kubewi
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: headlamp-ros
subjects:
  - kind: ServiceAccount
    name: headlamp-ros
    namespace: ros
