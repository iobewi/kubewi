---
apiVersion: v1
kind: Namespace
metadata:
  name: provisioning
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: dnsmasq-config
  namespace: provisioning
data:
  dnsmasq.conf: |
    interface=br0
    bind-interfaces
    dhcp-range=192.168.0.100,192.168.0.200,1h
    dhcp-option=option:router,192.168.0.1
    dhcp-option=option:dns-server,192.168.0.1
    dhcp-authoritative
    log-dhcp
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dnsmasq-provisioning
  namespace: provisioning
  annotations:
    description: "DHCP temporaire pour bootstrap des workers — off par défaut"
spec:
  replicas: 0
  selector:
    matchLabels:
      app: dnsmasq-provisioning
  template:
    metadata:
      labels:
        app: dnsmasq-provisioning
    spec:
      hostNetwork: true
      nodeSelector:
        node-role.kubernetes.io/control-plane: ""
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          effect: NoSchedule
      containers:
        - name: dnsmasq
          image: 4km3/dnsmasq:2.90-r3
          args:
            - --conf-file=/etc/dnsmasq/dnsmasq.conf
            - --no-daemon
          securityContext:
            capabilities:
              add:
                - NET_ADMIN
                - NET_RAW
          volumeMounts:
            - name: config
              mountPath: /etc/dnsmasq
      volumes:
        - name: config
          configMap:
            name: dnsmasq-config
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: dnsmasq-provisioning
  namespace: provisioning
spec:
  endpointSelector:
    matchLabels:
      app: dnsmasq-provisioning
  ingress:
    - toPorts:
        - ports:
            - port: "67"
              protocol: UDP
            - port: "22"
              protocol: TCP
