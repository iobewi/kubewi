- name: RPi OS — cgroups et zram (aarch64 uniquement)
  hosts: all
  gather_facts: true
  tasks:
    - ansible.builtin.include_role:
        name: rpios
      when: ansible_architecture == 'aarch64'

- name: Base Debian provisioning
  hosts: all
  roles:
    - debian

- name: Gateway provisioning
  hosts: gateways
  roles:
    - network
    - gateway
    - wireguard

- name: Controller provisioning
  hosts: controllers:!gateways
  roles:
    - network
    - internal

- name: Worker provisioning
  hosts: workers
  roles:
    - network
    - internal
