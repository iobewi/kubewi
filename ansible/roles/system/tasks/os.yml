- name: Disable cloud-init completely
  ansible.builtin.file:
    path: /etc/cloud/cloud-init.disabled
    state: touch
    mode: "0644"
    modification_time: preserve
    access_time: preserve
  ignore_errors: true

- name: Update /etc/hosts
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: '^127\.0\.1\.1'
    line: "127.0.1.1 {{ inventory_hostname }}"

- name: Set hostname
  ansible.builtin.hostname:
    name: "{{ inventory_hostname }}"

- name: Set timezone
  community.general.timezone:
    name: "{{ system_timezone }}"

- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install base packages
  ansible.builtin.apt:
    name: "{{ system_packages }}"
    state: present

- name: Generate locales
  community.general.locale_gen:
    name: "{{ item }}"
    state: present
  loop: "{{ system_locales }}"

- name: Enable and start avahi-daemon
  ansible.builtin.systemd:
    name: avahi-daemon
    enabled: true
    state: started

- name: Enable cgroup memory on RPi bootloader
  ansible.builtin.replace:
    path: "{{ item }}"
    regexp: '(^(?!.*cgroup_enable=memory).+)$'
    replace: '\1 cgroup_memory=1 cgroup_enable=memory'
  loop:
    - /boot/firmware/cmdline.txt
    - /boot/cmdline.txt
  ignore_errors: true
  register: cgroup_boot
  when: ansible_architecture == 'aarch64'

- name: Reboot if cgroup cmdline changed
  ansible.builtin.reboot:
    reboot_timeout: 120
  when:
    - ansible_architecture == 'aarch64'
    - cgroup_boot.results | selectattr('changed', 'equalto', true) | list | length > 0

- name: Check active swap
  ansible.builtin.command: cat /proc/swaps
  register: swap_active
  changed_when: false

- name: Disable zram swap device (Trixie)
  ansible.builtin.command: swapoff /dev/zram0
  when: "'/dev/zram0' in swap_active.stdout"
  changed_when: "'/dev/zram0' in swap_active.stdout"

- name: Mask zram swap unit (Trixie)
  ansible.builtin.systemd:
    name: systemd-zram-setup@zram0
    masked: true
    daemon_reload: true
  when: ansible_architecture == 'aarch64'

- name: Disable swap (persistent — fstab)
  ansible.builtin.replace:
    path: /etc/fstab
    regexp: '^([^#].*?\sswap\s+\S+\s+.*)$'
    replace: '# \1'


- name: Load kernel modules
  community.general.modprobe:
    name: "{{ item }}"
    state: present
    persistent: present
  loop: "{{ system_kernel_modules }}"

- name: Apply sysctl parameters
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    sysctl_set: true
    state: present
    reload: true
  loop: "{{ system_sysctl | dict2items }}"
