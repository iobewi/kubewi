- name: Get latest k0s version
  ansible.builtin.uri:
    url: https://api.github.com/repos/k0sproject/k0s/releases/latest
    return_content: true
  register: k0s_release
  when: k0s_version is not defined

- name: Set k0s version from latest release
  ansible.builtin.set_fact:
    k0s_version: "{{ k0s_release.json.tag_name }}"
  when: k0s_version is not defined

- name: Set k0s architecture
  ansible.builtin.set_fact:
    k0s_arch: "{{ 'amd64' if ansible_architecture == 'x86_64' else 'arm64' }}"

- name: Download k0s binary
  ansible.builtin.get_url:
    url: "https://github.com/k0sproject/k0s/releases/download/{{ k0s_version }}/k0s-{{ k0s_version }}-{{ k0s_arch }}"
    dest: "{{ k0s_install_dir }}/k0s"
    mode: "0755"
    force: false
